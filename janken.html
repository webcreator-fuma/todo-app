<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>じゃんけん</title>
    <style>
     body {
    font-family: sans-serif;
    text-align: center;
    background: #fffbe6;
    margin-top: 60px;
  }
  h1 { color: #2563eb; }
  #result {
    font-size: 50px;
    font-weight: bold;
    margin: 30px 0;
    color:rgb(255, 0, 0);
  }
  button {
    font-size: 18px;
    padding: 10px 16px;
    margin: 6px 4px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
 </style>   
</head>
<body>
    <h1>じゃんけん</h1>
<button data-hand="グー">グー</button>
<button data-hand="チョキ">チョキ</button>
<button data-hand="パー">パー</button>
<button id="reset">リセット</button>
<div id="result"></div> 
<div id="score">勝ち: 0, 負け: 0</div>

<script>
const hands = ["グー", "チョキ", "パー"];
let wins = Number(localStorage.getItem("wins")) || 0;
let losses = Number(localStorage.getItem("losses")) || 0;
document.querySelector("#score").textContent = "勝ち: " + wins + ", 負け: " + losses;
 document.querySelectorAll("[data-hand]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const hand = btn.dataset.hand;
        const computer = hands[Math.floor(Math.random() * hands.length)];
        const resultEl = document.getElementById("result");
        if (hand === computer) {
            resultEl.textContent = "コンピューターは" + computer + "です。あいこです。";
        }
        else if (hand === "グー" && computer === "チョキ" ||
                 hand === "チョキ" && computer === "パー" ||
                 hand === "パー" && computer === "グー") {
            resultEl.textContent = "コンピューターは" + computer + "です。あなたのかちです。";
            wins++;
        }
        else {
            resultEl.textContent = "コンピューターは" + computer + "です。あなたの負けです。";
            losses++;
        }
        document.getElementById("score").textContent = "勝ち: " + wins + ", 負け: " + losses;
        localStorage.setItem("wins", wins);
        localStorage.setItem("losses", losses);
    });
    });
    const resetButton = document.getElementById("reset");
    resetButton.addEventListener("click", function () {
        wins = 0;
        losses = 0;
        localStorage.removeItem("wins");
        localStorage.removeItem("losses");
        document.getElementById("score").textContent = "勝ち: " + wins + ", 負け: " + losses;
        document.getElementById("result").textContent = "";
    });
</script>    
</body>
</html>
